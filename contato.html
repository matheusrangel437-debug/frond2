<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Loja de Celulares</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <header>
        <h1>Loja de Celulares</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="contato.html" class="active">Contato</a>
        </nav>
    </header>

    <main class="contato-container">
        <section class="card-contato">
            <h2>Entre em contato</h2>
            <p>Preencha o formulário abaixo para nos enviar uma mensagem.</p>

            <form action="#" method="POST">
                <div class="input-group">
                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                </div>

                <div class="input-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="input-group">
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="5" placeholder="Digite sua mensagem" required></textarea>
                </div>

                <button type="submit" class="btn-enviar">Enviar mensagem</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Loja de Celulares. Todos os direitos reservados.</p>
        <p>Entre em contato conosco para saber mais sobre nossos produtos.</p>
    </footer>

</body>
</html>
